<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flipbook PDF Viewer</title>

  <!-- jQuery + Stable Turn.js v3 + PDF.js -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/blasten/turn.js@3/turn.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.12.313/pdf.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f0f0f0;
      overflow: hidden;
      font-family: sans-serif;
    }

    .flipbook-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #flipbook {
      width: 800px;
      height: 600px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      border: 1px solid #ccc;
    }

    .page {
      width: 100%;
      height: 100%;
      background: #fff;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

<div class="flipbook-container">
  <div id="flipbook"></div>
</div>

<script>
  const pdfPath = 'Brand Guideline Re-Imagine .pdf';
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.12.313/pdf.worker.min.js';

  const loadPDF = async () => {
    const loadingTask = pdfjsLib.getDocument(pdfPath);
    const pdf = await loadingTask.promise;

    const pages = [];

    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
      const page = await pdf.getPage(pageNum);
      const viewport = page.getViewport({ scale: 1.5 });

      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      canvas.width = viewport.width;
      canvas.height = viewport.height;

      await page.render({ canvasContext: context, viewport }).promise;

      const img = new Image();
      img.src = canvas.toDataURL();
      img.alt = `Page ${pageNum}`;

      const pageDiv = document.createElement('div');
      pageDiv.className = 'page';
      pageDiv.appendChild(img);
      pages.push(pageDiv);
    }

    const flipbook = document.getElementById('flipbook');
    pages.forEach(p => flipbook.appendChild(p));

    $('#flipbook').turn({
      width: 800,
      height: 600,
      autoCenter: true,
      acceleration: true,
      gradients: true,
      elevation: 50
    });
  };

  loadPDF();
</script>

</body>
</html>
