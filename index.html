<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PDF Flipbook Viewer</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/4.1.0/turn.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.12.313/pdf.min.js"></script>

  <style>
    body {
      background: #f5f5f5;
      margin: 0;
      padding: 40px 0;
      font-family: sans-serif;
    }

    #flipbook {
      width: 800px;
      height: 600px;
      margin: auto;
    }

    .page {
      width: 100%;
      height: 100%;
      background: #fff;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid #ddd;
    }

    canvas {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

<div id="flipbook"></div>

<script>
  const pdfPath = 'Brand Guideline Re-Imagine .pdf'; // Adjust if filename changes
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.12.313/pdf.worker.min.js';

  const loadPDF = async () => {
    const loadingTask = pdfjsLib.getDocument(pdfPath);
    const pdf = await loadingTask.promise;

    let pagesRendered = 0;

    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
      const page = await pdf.getPage(pageNum);
      const scale = 1.5;
      const viewport = page.getViewport({ scale });

      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      await page.render({ canvasContext: context, viewport }).promise;

      const pageDiv = document.createElement('div');
      pageDiv.className = 'page';
      pageDiv.appendChild(canvas);
      document.getElementById('flipbook').appendChild(pageDiv);

      pagesRendered++;

      // 🧠 Initialize Turn.js only after all pages are rendered
      if (pagesRendered === pdf.numPages) {
        $('#flipbook').turn({
          width: 800,
          height: 600,
          autoCenter: true,
          elevation: 50,
          gradients: true
        });
      }
    }
  };

  loadPDF();
</script>

</body>
</html>
